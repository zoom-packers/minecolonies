repositories {
    mavenLocal()
    maven {
        name = 'LocalBlockUI'
        url = uri(rootProject.layout.projectDirectory.dir('../BlockUI/repo'))
    }
    maven {
        name = 'LocalDomumOrnamentum'
        url = uri(rootProject.layout.projectDirectory.dir('../Domum-Ornamentum/repo'))
    }
    maven {
        name = 'LocalStructurize'
        url = uri(rootProject.layout.projectDirectory.dir('../Structurize/repo'))
    }
    maven {
        name = 'LDTTeamModding'
        url = uri('https://ldtteam.jfrog.io/ldtteam/modding/')
    }
    maven {
        name = 'JourneyMap'
        url = uri('https://jm.gserv.me/repository/maven-public/')
    }
}

dependencies {
    implementation('com.ldtteam:domum-ornamentum:26.3-zp5.1')
    implementation('com.ldtteam:blockui:26.3-zp5.1')
    implementation('com.ldtteam:structurize:26.3-zp5.1')
    implementation('com.ldtteam:multipiston:26.3-zp5.1')
    // ZP5: DynamicTrees 26.3 isn't published; its compat class is dropped and the no-op DynamicTreeProxy stays.

    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.8.0.49'
    runtimeOnly 'mezz.jei:jei-26.3-neoforge:31.15.0.79' // ZP5: the pack's JEI

    compileOnly 'info.journeymap:journeymap-api-neoforge:26.2-2.0.0'

    testImplementation 'junit:junit:4.13.2'
}
